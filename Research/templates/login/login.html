{% load static %}

{% include 'partials/headers.html' %}

<header>
  <title>Login</title>
  <link rel="icon" type="image/x-icon" href="{% static 'unnamed.ico' %}">
</header>

<div class="limiter">
  <div class="container-login100">
    <div class="wrap-login100">

      <form class="login100-form validate-form" method="POST" action="{% url 'login_user' %}">
        {% csrf_token %}
        <span class="login100-form-title">
          Login
        </span>

        {% if 'error' in request.session %}
        <div class="alert alert-danger" role="alert">
          {{ request.session.error }}
        </div>
        {% endif %}

        <div class="wrap-input100 validate-input" data-validate="Username is required">
          <input class="input100" type="text" name="username" placeholder="Username">
          <span class="focus-input100"></span>
          <span class="symbol-input100">
            <i class="fa fa-envelope" aria-hidden="true"></i>
          </span>
        </div>

        <div class="wrap-input100 validate-input" data-validate="Password is required">
          <input class="input100" type="password" name="password" placeholder="Password" id="password-field">
          <span class="focus-input100"></span>
          <span class="symbol-input100">
            <i class="fa fa-lock" aria-hidden="true"></i>
          </span>
          <span class="btn-show-pass">
            <i class="fa fa-eye" aria-hidden="true" onclick="togglePassword()"></i>
          </span>
        </div>

        <div class="container-login100-form-btn">
          <button class="login100-form-btn">
            Login
          </button>
        </div>
      </form>

    </div>
  </div>
</div>

{% include 'partials/footer.html' %}

<script>
  function togglePassword() {
    var passwordField = document.getElementById("password-field");
    var showPassIcon = document.querySelector(".btn-show-pass i");
    if (passwordField.type === "password") {
      passwordField.type = "text";
      showPassIcon.classList.remove("fa-eye");
      showPassIcon.classList.add("fa-eye-slash");
    } else {
      passwordField.type = "password";
      showPassIcon.classList.remove("fa-eye-slash");
      showPassIcon.classList.add("fa-eye");
    }
  }
</script>

<style>
  .btn-show-pass {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
  }

  @media (max-width: 100px) {
    .wrap-login100 {
      padding: 15px;
    }

    .input100 {
      font-size: 14px;
      padding: 10px;
    }

    .container-login100-form-btn {
      text-align: center;
    }

    .symbol-input100 {
      position: absolute;
      right: 1px;
      top: 50%;
      transform: translateY(-50%);
    }
  }
</style>
