{% extends 'base.html' %}

{% block title %}Add New PI{% endblock %}

{% block content %}
<div class="container-fluid py-5">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2" style="box-shadow: 0px 3px 10px #bfbfbf; height: 100%; background-color: #ffffff;">
            <!-- Sidebar content here -->
        </div>

        <!-- Main content area -->
        <div class="col-md-10">
            <h1 class="text-center text-uppercase mb-4">Add New Co. Principal Investigator</h1>

            <form method="POST" class="card shadow-sm p-4" id="add-pi-form">
                {% csrf_token %}
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="PSRN" class="form-label">PSRN:<span class="text-danger">*</span></label>
                        <input type="text" id="PSRN" name="PSRN" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label for="Name_PI" class="form-label">Name of Co. Principal Investigator:<span class="text-danger">*</span></label>
                        <input type="text" id="Name_PI" name="Name_PI" class="form-control" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="Designation_PI" class="form-label">Designation:<span class="text-danger">*</span></label>
                        <input type="text" id="Designation_PI" name="Designation_PI" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label for="organization" class="form-label">Organization:<span class="text-danger">*</span></label>
                        <select id="organization" name="organization" class="form-select" required>
                            <option value="">-- Select an Option --</option>
                            {% for org in organizations %}
                                <option value="{{ org.id }}">{{ org.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="department" class="form-label">Department:<span class="text-danger">*</span></label>
                        <select id="department" name="department" class="form-select" required>
                            <option value="">-- Select an Option --</option>
                            {% for dept in departments %}
                                <option value="{{ dept.id }}">{{ dept.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="superannuation_year" class="form-label">Year of Superannuation:</label>
                        <input type="number" id="superannuation_year" name="superannuation_year" class="form-control" min="1900" max="2100" placeholder="YYYY" />
                    </div>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary" id="save-pi-btn" disabled>Save PI</button>
                    <a href="{% url 'add_project' %}" class="btn btn-secondary ms-3">Back to Add Project</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_css %}
<style>
    .card {
        border-radius: 0.5rem;
        padding: 2rem;
    }

    .form-label {
        font-weight: bold;
    }

    .btn-primary {
        background-color: #007bff;
        border-color: #007bff;
    }

    .btn-primary:hover {
        background-color: #0056b3;
        border-color: #004085;
    }

    .btn-secondary {
        background-color: #6c757d;
        border-color: #6c757d;
    }

    .btn-secondary:hover {
        background-color: #5a6268;
        border-color: #545b62;
    }
</style>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('add-pi-form');
        const submitButton = document.getElementById('save-pi-btn');
        const requiredFields = form.querySelectorAll('[required]');

        function checkRequiredFields() {
            let allFilled = true;
            requiredFields.forEach(field => {
                if (!field.value.trim()) {
                    allFilled = false;
                }
            });
            submitButton.disabled = !allFilled;
        }

        requiredFields.forEach(field => {
            field.addEventListener('input', checkRequiredFields);
        });

        // Initial check
        checkRequiredFields();
    });
</script>
{% endblock %}
